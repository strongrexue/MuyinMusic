syntax = "proto3";

package clouddrive;

// Trimmed subset of the official CloudDrive2 API definition.
// Source: https://www.clouddrive2.com/api/clouddrive.proto (version 1.2.0-beta,
// 260 RPCs). Only the RPCs and fields MuyinMusic needs for cloud music are
// kept: directory enumeration (GetSubFiles), playback URL resolution
// (GetDownloadUrlPath) and a connectivity probe (GetSystemInfo). Field
// numbers and types are copied verbatim from the official definition, so the
// wire format stays compatible; undeclared fields are skipped by the parser.
// CloudDriveFile.detailProperties / CloudAPI and the archive/badge fields of
// the official message are intentionally omitted.

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service CloudDriveFileSrv {
  // Public method, no authorization required. Used as a connectivity probe.
  rpc GetSystemInfo(google.protobuf.Empty) returns (CloudDriveSystemInfo) {}
  // Lists one directory level; items arrive as a stream of SubFilesReply.
  rpc GetSubFiles(ListSubFileRequest) returns (stream SubFilesReply) {}
  // Resolves a playable/downloadable URL for one file path.
  rpc GetDownloadUrlPath(GetDownloadUrlPathRequest)
      returns (DownloadUrlPathInfo) {}
}

message CloudDriveSystemInfo {
  bool IsLogin = 1;
  string UserName = 2;
  bool SystemReady = 3;
}

message ListSubFileRequest {
  string path = 1;
  bool forceRefresh = 2;
  optional bool checkExpires = 3;
}

message SubFilesReply { repeated CloudDriveFile subFiles = 1; }

message CloudDriveFile {
  string id = 1;
  string name = 2;
  string fullPathName = 3;
  int64 size = 4;
  google.protobuf.Timestamp createTime = 6;
  google.protobuf.Timestamp writeTime = 7;
  string thumbnailUrl = 10;
  string previewUrl = 11;

  bool isDirectory = 30;
  bool isForbidden = 36;

  enum HashType {
    Unknown = 0;
    Md5 = 1;
    Sha1 = 2;
    PikPakSha1 = 3;
  }
  map<uint32, string> fileHashes = 70;

  // Download URL info attached to file items when the server provides it.
  optional DownloadUrlPathInfo downloadUrlPath = 76;
}

message GetDownloadUrlPathRequest {
  string path = 1;
  bool preview = 2;
  bool lazy_read = 3;
  bool get_direct_url = 4; // if true, get direct URL of cloud storage if available
}

message DownloadUrlPathInfo {
  string downloadUrlPath = 1; // path+query with {SCHEME}/{HOST}/{PREVIEW} placeholders
  optional uint64 expiresIn = 2; // seconds until expiration, none = never
  optional string directUrl = 3; // direct URL, overrides downloadUrlPath
  optional string userAgent = 4; // UA to use when accessing directUrl
  map<string, string> additionalHeaders = 5; // headers for directUrl
}

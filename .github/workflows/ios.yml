name: iOS Build

# Builds the iOS app on a hosted macOS runner, so a Mac is not needed locally.
# The unsigned .ipa it produces can be signed on Windows with Sideloadly/AltStore
# (free Apple ID, 7-day certificate) or uploaded to TestFlight with an account.
#
# Batch-1 scope: BASS 播放 + JS 音源运行时 + Runner 原生通道 + 后台/锁屏。
# Batch-2 scope: 灵动岛实时活动 + 桌面小组件（WidgetKit 扩展，build_widget_extension.sh
#               独立编译后嵌入 PlugIns/）+ 备用图标运行时 + iOS 文件打开（takePendingAudio）。
on:
  # Manual dispatch is available once this workflow is merged to the default branch.
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支或 tag'
        required: false
        default: ''
  push:
    branches:
      - ios
    tags:
      - 'ios-*'
    # 文档/截图等改动没必要跑 10 分钟的 macOS 构建。
    paths-ignore:
      - '**/*.md'
      - 'screenshots/**'
      - 'repos/**'

env:
  # 项目要求 Flutter >= 3.41.0（pubspec: sdk ^3.11.4，flutter >=3.47.9）。
  FLUTTER_VERSION: '3.47.9'
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor / version
        run: |
          flutter --version
          flutter doctor -v

      # BASS 的二进制按官方要求不入库，构建前从 un4seen 取。
      # 没有这一步，pod install 会直接报「未找到 BASS iOS 二进制」。
      - name: Fetch BASS iOS binaries
        run: bash tool/fetch_bass_ios.sh

      # preload.js 在 Android 与 iOS 各有一份，必须是同一份内容。
      - name: Verify preload.js parity
        run: |
          set -e
          a=android/app/src/main/assets/music_source_preload.js
          b=packages/music_source_runtime/ios/Resources/music_source_preload.js
          if ! diff -q "$a" "$b"; then
            echo "::error::music_source_preload.js 两端不一致。请同步："
            echo "  cp $a $b"
            exit 1
          fi
          echo "preload.js md5: $(md5 -q "$a")"

      # preload.js 的协议与执行顺序是两端共用的硬约束。
      - name: Verify preload protocol & call order
        run: node tool/verify_preload_protocol.mjs

      # Swift 私有方法改了参数而调用点漏改这类签名不匹配，编译前先抓。
      - name: Verify Swift call sites
        run: node tool/verify_swift_call_sites.mjs

      # patch_xcodeproj.py 已把 ALTERNATE_APPICON_NAMES 注入构建设置，
      # 需先生成备用图标集，否则 actool 会因找不到 icon set 而失败。
      - name: Prepare iOS alternate icons
        run: bash tool/fetch_app_icons.sh

      - name: Flutter pub get
        run: flutter pub get

      # iOS 有独立版本号体系（tool/ios_version.txt 是唯一来源）。
      - name: Resolve iOS version
        id: version
        run: |
          set -e
          VERSION="$(tr -d '[:space:]' < tool/ios_version.txt)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::tool/ios_version.txt 内容 '$VERSION' 不是 x.y.z 形式"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "iOS 版本: $VERSION (${{ github.run_number }})"

      # 幂等：把新增 Swift 文件接进 Runner Compile Sources，部署目标对齐 16.2。
      - name: Ensure Xcode project wiring
        run: python3 tool/patch_xcodeproj.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        # 上游测试里有若干依赖真机/网络的诊断用例，失败不阻断出包。
        continue-on-error: true
        run: flutter test

      - name: Pod install
        working-directory: ios
        run: |
          pod repo update || true
          pod install --verbose

      # 链接失败时最难查的就是「pod 到底有没有把 BASS 链进来」。
      - name: Dump pod link settings (diagnostics)
        run: |
          set +e
          echo "::group::BASS frameworks on disk"
          ls -la packages/bass_player/ios/Frameworks/ 2>&1
          find packages/bass_player/ios/Frameworks -maxdepth 2 -name 'Info.plist' 2>&1 | head -20
          echo "::endgroup::"
          echo "::group::bass_player xcconfig (Release)"
          cat "ios/Pods/Target Support Files/bass_player/bass_player.release.xcconfig" 2>&1
          echo "::endgroup::"
          echo "::group::Pods-Runner xcconfig (Release)"
          cat "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig" 2>&1
          echo "::endgroup::"

      - name: Verify live activity authorization
        run: node tool/verify_live_activity_auth.mjs

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.number }}"

      # WidgetKit 扩展（灵动岛实时活动 + 桌面小组件）已作为正经的 app-extension
      # target 接进 Runner.xcodeproj：由 patch_xcodeproj.py 注入 target 与
      # "Embed App Extensions" phase，flutter build ios 通过 target 依赖自动编译。
      # 注意：--no-codesign 会全局禁签名，Xcode 虽编译出 appex，但 embed 阶段
      # 因 extension 隐含 CodeSignOnCopy 而被跳过，不会自动 copy 到 PlugIns/。
      # 这里把 Xcode 已编译好的正规 appex 显式嵌入（不回退 swiftc 手工拼装）。
      - name: Verify WidgetKit extension
        run: |
          set -euo pipefail
          APP_PATH=build/ios/iphoneos/Runner.app
          APPEX="$APP_PATH/PlugIns/CyShineMusicWidget.appex"
          BUILT_APPEX=build/ios/iphoneos/CyShineMusicWidget.appex
          if [ ! -d "$APPEX" ] && [ -d "$BUILT_APPEX" ]; then
            echo "no-codesign 下 Embed App Extensions 未执行，手动嵌入 Xcode 编译的 appex"
            mkdir -p "$APP_PATH/PlugIns"
            cp -R "$BUILT_APPEX" "$APPEX"
          fi
          test -d "$APPEX" || { echo "::error::$APPEX 不存在，灵动岛扩展没打进去"; exit 1; }
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          APPEX_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APPEX/Info.plist")
          case "$APPEX_ID" in
            "$APP_ID".*) ;;
            *) echo "::error::扩展 bundle id ($APPEX_ID) 未以主 App ($APP_ID) 为前缀，iOS 会拒绝加载"; exit 1 ;;
          esac
          APP_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          APPEX_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APPEX/Info.plist")
          test "$APP_VER" = "$APPEX_VER" || { echo "::error::版本不一致：App $APP_VER / 扩展 $APPEX_VER"; exit 1; }
          APP_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist")
          APPEX_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APPEX/Info.plist")
          test "$APP_BUILD" = "$APPEX_BUILD" || { echo "::error::构建号不一致：App $APP_BUILD / 扩展 $APPEX_BUILD"; exit 1; }
          echo "[ok] 扩展校验通过：$APPEX_ID / $APPEX_VER ($APPEX_BUILD)，前缀与版本均与主 App 对齐"

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=build/ios/iphoneos/Runner.app
          test -d "$APP_PATH" || { echo "::error::$APP_PATH 不存在，构建没有产出 app"; exit 1; }
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qry ../MuyinMusic-unsigned.ipa Payload
          cd ../..
          ls -lh build/MuyinMusic-unsigned.ipa
          # Batch-2 校验：WidgetKit 扩展是否真的被打进 IPA。
          echo "::group::Widget extension on disk"
          ls -la "$APP_PATH/PlugIns" 2>&1 || true
          find "$APP_PATH/PlugIns" -maxdepth 2 -name '*.appex' 2>&1 || true
          echo "::endgroup::"
          echo "### 产物" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "未签名 IPA: build/MuyinMusic-unsigned.ipa" >> "$GITHUB_STEP_SUMMARY"
          echo "版本: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.number }})" >> "$GITHUB_STEP_SUMMARY"
          echo "App 大小: $(du -sh "$APP_PATH" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "安装方式：用 AltStore / Sideloadly 侧载（免费证书 7 天有效，需定期重签）。" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MuyinMusic-unsigned-ipa
          path: build/MuyinMusic-unsigned.ipa
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ios/Pods/Target Support Files/**/*.log
            build/ios/**/*.log
          if-no-files-found: ignore
          retention-days: 7